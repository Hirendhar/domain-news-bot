name: Email Test

# Fast (~40s) diagnostic: sends one test email via the configured SMTP
# provider (Brevo by default in CI, Gmail fallback) straight from a GitHub
# Actions runner. Trigger manually from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send test email via configured provider
        env:
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
          NOTIFY_EMAIL_TO:    ${{ secrets.NOTIFY_EMAIL_TO }}
          # Gmail fallbacks (used only if SMTP_* unset)
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          from emailer import send_email, is_configured, _cfg
          c = _cfg()
          print(f"host={c['host']}:{c['port']}  user={c['user']!r}  from={c['from']!r}  to={c['to']!r}  pw_len={len(c['password'])}")

          # Non-secret structural checks (these derived numbers aren't masked)
          def struct(label, v):
              print(f"  {label}: len={len(v)}  at_count={v.count('@')}  "
                    f"has_space={any(ch.isspace() for ch in v)}  "
                    f"at_pos={v.find('@')}  endswith_com={v.endswith('.com')}")
          struct("to  ", c["to"])
          struct("from", c["from"])

          if not is_configured():
              print("FAILED: email not configured — set SMTP_* (or GMAIL_*) and NOTIFY_EMAIL_TO secrets.")
              raise SystemExit(1)
          ok = send_email("Domain News Bot — CI email test",
                          "Test email sent from a GitHub Actions runner. If you got this, CI email works.")
          raise SystemExit(0 if ok else 1)
          PY
